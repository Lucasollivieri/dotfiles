###################
### VARIABLES ###
###################
$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus 
$menu = rofi

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprland-session.target
exec-once = qs -c noctalia-shelld
exec-once = hyprpaper
exec-once = waybar
# exec-once = ~/.config/swaync/update_clock.sh


source = ~/.config/hypr/env.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/monitors.conf

#################
### GENERAL ###
#################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 3
    col.active_border = rgba(76abaeee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

#################
### DECORATION ###
#################
decoration {
    rounding = 16

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = false
        noise = 0.0117
        contrast = 1.1
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        popups = true
        popups_ignorealpha = 0.6
    }

    dim_inactive = true 
    dim_strength = 0.05
}

#################
### ANIMATIONS ###
#################
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi


animations {
    enabled = yes, please :)

    bezier = easeOutQuint, 0.23, 1,    0.32,    1
    bezier = easeOutQuint, 0.65, 0.05, 0.36,    1
    bezier = linear,       0,    0,    1,       1
    bezier = almostLinear, 0.5,  0.5,   0.75,   1
    bezier = quick,        0.15,  0,     0.1,   1

     

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick

}

#################
### LAYOUT ###
#################
dwindle {
    preserve_split = yes
    smart_split = false
    smart_resizing = true
    force_split = 2
}

master {
    new_status = master
    new_on_top = false
}


#################
### INPUT ###
#################
input {
    kb_layout = us
    kb_variant = intl

    repeat_delay = 200
    repeat_rate = 60

    follow_mouse = 1
    mouse_refocus = false
    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        middle_button_emulation = true
    }
}


#################################
### WINDOW RULES ###
#################################

# Browsers – optimized blur
windowrule = match:class ^(firefox)$, opacity 1.0 override
windowrule = match:class ^(google-chrome)$, opacity 1.0 override
windowrule = match:class ^(chromium)$, opacity 1.0 override
windowrule = match:class ^(brave)$, opacity 1.0 override
windowrule = match:class ^(zen-browser)$, opacity 1.0 override

# Neovide
windowrule = match:class ^(neovide)$, opacity 0.95 override

# Vicinae launcher
windowrule {
    name = vicinae-launcher
    match:class = ^(vicinae)$
    
    float = on
    center = on
    stay_focused = on
    border_size = 0
    opacity = 0.98 override
}

# Picture-in-Picture
windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    
    float = on
    pin = on
    opacity = 1.0 override
}

# Terminals - subtle transparency
windowrule = match:class ^(ghostty)$, opacity 0.96 override
windowrule = match:class ^(kitty)$, opacity 0.96 override


#################
### WORKSPACES ###
#################

# monitor principal
workspace = 1, monitor:DP-1, default:true
workspace = 3, monitor:DP-1
workspace = 5, monitor:DP-1

# monitor secundário
workspace = 2, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1

# especiais
workspace = special:magic
workspace = special:scratch


#################################
### MISC ###
#################################
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}


#################################
### TRACKPAD GESTURES ###
#################################

# Workspace switching
gesture = 3, horizontal, scale: 1.4, workspace

# Window management
gesture = 3, down, mod: ALT, close
gesture = 3, up, mod: SUPER, fullscreen
gesture = 3, left, mod: SUPER, float

# Move / Resize
gesture = 4, swipe, move
gesture = 4, pinch, resize

# Special workspace
gesture = 3, pinchin, special, scratch
gesture = 3, pinchout, special, scratch
