###################
### VARIABLES ###
###################
$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus 
$menu = rofi




#################
### AUTOSTART ###
#################
exec-once = qs -c noctalia-shelld
exec-once = hyprpaper
exec-once = waybar


source = ~/.config/hypr/env.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/monitors.conf

#################
### GENERAL ###
#################
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 0
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

#################
### DECORATION ###
#################
decoration {
    rounding = 16

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = false
        noise = 0.0117
        contrast = 1.1
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        popups = true
        popups_ignorealpha = 0.6
    }

    dim_inactive = true 
    dim_strength = 0.05
}

#################
### ANIMATIONS ###
#################
animations {
    enabled = false
}

#################
### LAYOUT ###
#################
dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = false
    smart_resizing = true
    force_split = 2
}

master {
    new_status = master
    new_on_top = false
}


#################
### INPUT ###
#################
input {
    kb_layout = us
    kb_variant = intl

    repeat_delay = 200
    repeat_rate = 60

    follow_mouse = 1
    mouse_refocus = false
    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        middle_button_emulation = true
    }
}


#################################
### WINDOW RULES ###
#################################

# Browsers – optimized blur
windowrule = match:class ^(firefox)$, opacity 1.0 override
windowrule = match:class ^(google-chrome)$, opacity 1.0 override
windowrule = match:class ^(chromium)$, opacity 1.0 override
windowrule = match:class ^(brave)$, opacity 1.0 override
windowrule = match:class ^(zen-browser)$, opacity 1.0 override

# Neovide
windowrule = match:class ^(neovide)$, opacity 0.95 override

# Vicinae launcher
windowrule {
    name = vicinae-launcher
    match:class = ^(vicinae)$
    
    float = on
    center = on
    stay_focused = on
    border_size = 0
    opacity = 0.98 override
}

# Picture-in-Picture
windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    
    float = on
    pin = on
    opacity = 1.0 override
}

# Terminals - subtle transparency
windowrule = match:class ^(ghostty)$, opacity 0.96 override
windowrule = match:class ^(kitty)$, opacity 0.96 override


#################
### WORKSPACES ###
#################

# monitor principal
workspace = 1, monitor:DP-1, default:true
workspace = 3, monitor:DP-1
workspace = 5, monitor:DP-1

# monitor secundário
workspace = 2, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1

# especiais
workspace = special:magic
workspace = special:scratch


#################################
### MISC ###
#################################
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}


#################################
### TRACKPAD GESTURES ###
#################################

# Workspace switching
gesture = 3, horizontal, scale: 1.4, workspace

# Window management
gesture = 3, down, mod: ALT, close
gesture = 3, up, mod: SUPER, fullscreen
gesture = 3, left, mod: SUPER, float

# Move / Resize
gesture = 4, swipe, move
gesture = 4, pinch, resize

# Special workspace
gesture = 3, pinchin, special, scratch
gesture = 3, pinchout, special, scratch
