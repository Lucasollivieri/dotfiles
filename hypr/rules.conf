# Desativa o blur (desfoque) em janelas rodando via XWayland para evitar caixas de desfoque ao redor de menus.
windowrule = no_blur on, match:xwayland 1

# Diálogos de seleção de arquivos (XDG Desktop Portal e File Choosers)
windowrule {
    name = center-file-pickers
    match:class = ^([Xx]dg-desktop-portal-gtk|[Xx]dg-desktop-portal-gnome|[Xx]dg-desktop-portal-kde|[Xx]dg-desktop-portal-hyprland)$
    float = on
    center = on
    stay_focused = on
    size = 900 600
}

# Diálogos genéricos de abrir/salvar por título
windowrule {
    name = center-file-dialog-titles
    match:title = ^(Abrir arquivo|Open File|Salvar como|Save As|Selecionar arquivo|Select a File|Escolher arquivo|Choose Files|Abrir pastas?|Open Folder|Enviar arquivo|File Upload|.*wants to open.*|.*wants to save.*|.*quer abrir.*|.*quer salvar.*)$
    float = on
    center = on
    stay_focused = on
    size = 900 600
}

# Picture-in-Picture
windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    opacity = 1.0 override
}

# Navegadores
windowrule = opacity 1.0 override, match:class ^(firefox)$
windowrule = opacity 1.0 override, match:class ^(google-chrome)$
windowrule = opacity 1.0 override, match:class ^(chromium)$
windowrule = opacity 1.0 override, match:class ^(brave)$
windowrule = opacity 1.0 override, match:class ^(zen-browser)$

# Terminais e Editores
windowrule = opacity 0.96 override, match:class ^(kitty)$
windowrule = opacity 0.95 override, match:class ^(neovide)$
