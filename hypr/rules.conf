# Desativa o blur (desfoque) em janelas rodando via XWayland para evitar caixas de desfoque ao redor de menus.
windowrule {
    name = no-blur-xwayland
    match:xwayland = true
    no_blur = true
}

# Seletores de arquivo e diálogos de abertura/salvamento (GTK / Portal / Nautilus)
windowrule {
    name = center-file-pickers
    match:title = ^(Abrir arquivo|Open File|Salvar como|Save As|Selecionar arquivo|Select a File|Escolher arquivo|Choose Files|Abrir pastas?|Open Folder|Enviar arquivo|File Upload)$
    float = on
    center = on
    stay_focused = on
}

# Diálogo do XDG Desktop Portal GTK (FileChooser)
windowrule {
    name = center-xdg-desktop-portal-gtk
    match:class = ^(xdg-desktop-portal-gtk)$
    float = on
    center = on
    stay_focused = on
}

# Nautilus file manager dialogs / windows
windowrule {
    name = center-nautilus
    match:class = ^(org.gnome.Nautilus)$
    float = on
    center = on
}
